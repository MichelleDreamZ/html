<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vangeliicide Codes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080305;
            background-image: radial-gradient(#dc2626 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            background-repeat: repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        /* FONDO DE PANTALLA TOTALMENTE NÍTIDO (SIN BLUR NI DESENFOQUE) */
        body.custom-wallpaper {
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
        }

        .clean-overlay {
            min-height: 100vh;
            background: rgba(8, 3, 5, 0.85);
            display: flex;
            flex-direction: column;
        }

        .font-syne { font-family: 'Syne', sans-serif; }

        .red-btn {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
            transition: all 0.2s ease;
        }

        .red-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(220, 38, 38, 0.6);
        }

        /* TARJETA CON TAMAÑO DE APP DE CELULAR */
        .app-tile {
            background: rgba(18, 8, 12, 0.92);
            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-tile:hover {
            transform: translateY(-4px);
            border-color: rgba(220, 38, 38, 0.9);
            box-shadow: 0 12px 28px rgba(220, 38, 38, 0.3);
        }

        textarea.code-editor {
            font-family: 'Courier New', Courier, monospace;
            tab-size: 2;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 10px; }
    </style>
</head>
<body id="appBody">
    <div class="clean-overlay">

        <header class="sticky top-0 z-40 bg-black/85 border-b border-red-900/50 px-5 py-3 shadow-md backdrop-blur-md">
            <div class="max-w-6xl mx-auto flex items-center justify-between">
                
                <div class="flex items-center gap-3">
                    <img id="appLogoImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80" class="w-9 h-9 rounded-2xl object-cover border-2 border-red-600 shadow-sm cursor-pointer" onclick="openModal('logoModal')">
                    <div>
                        <h1 class="text-base font-extrabold font-syne text-red-500 leading-none">
                            Vangeliicide Codes
                        </h1>
                        <p class="text-[10px] font-extrabold text-red-400 tracking-wider">by Vangeliicide</p>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <label class="p-2.5 rounded-2xl bg-red-950/80 text-red-400 border border-red-900/50 hover:bg-red-900/80 transition cursor-pointer flex items-center gap-1 text-xs font-bold" title="Cambiar Fondo de Pantalla">
                        <i data-lucide="image" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Fondo</span>
                        <input type="file" id="wallpaperInput" accept="image/*" class="hidden" onchange="changeWallpaper(this)">
                    </label>

                    <button onclick="openModal('publishModal')" class="red-btn px-4 py-2 rounded-2xl text-xs font-bold flex items-center gap-1.5">
                        <i data-lucide="code" class="w-4 h-4"></i>
                        <span>+ Publicar</span>
                    </button>
                </div>

            </div>
        </header>

        <main class="flex-1 max-w-6xl w-full mx-auto p-5 sm:p-6 flex flex-col gap-5">
            
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="folder" class="w-5 h-5 text-red-500"></i>
                    <h2 class="text-sm font-extrabold text-red-200 tracking-wide font-syne">Proyectos</h2>
                </div>
                <span id="projectCountBadge" class="text-xs font-bold text-red-400 bg-red-950/80 border border-red-900/50 px-3 py-1 rounded-full">0</span>
            </div>

            <div id="projectsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5">
                </div>

        </main>

        <footer class="py-4 text-center border-t border-red-950 bg-black/60">
            <p class="text-[11px] font-bold text-red-500 tracking-wider">Vangeliicide Codes &bull; by Vangeliicide</p>
        </footer>

    </div>

    <div id="publishModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80">
        <div class="bg-zinc-950 w-full max-w-2xl rounded-3xl p-6 shadow-2xl flex flex-col gap-4 border border-red-900/60 max-h-[90vh] overflow-y-auto text-white">
            <div class="flex justify-between items-center border-b border-red-950 pb-3">
                <div class="flex items-center gap-2">
                    <i data-lucide="code-2" class="w-5 h-5 text-red-500"></i>
                    <h3 class="text-base font-bold font-syne text-red-500">Nuevo Código HTML</h3>
                </div>
                <button onclick="closeModal('publishModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-bold text-red-300 block mb-1">Nombre del Proyecto</label>
                    <input type="text" id="appNameInput" placeholder="Ej: Mi Proyecto, Calculadora, Reproductor..." class="w-full px-4 py-2.5 rounded-xl border border-red-900/50 bg-zinc-900 text-xs text-white focus:outline-none focus:border-red-500">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-red-300">Código HTML Completo (Pega o escribe tu código)</label>
                        <label class="text-[11px] text-red-400 font-bold cursor-pointer hover:underline">
                            Cargar archivo .html
                            <input type="file" id="htmlFileInput" accept=".html,.htm" class="hidden" onchange="loadFileIntoTextarea(this)">
                        </label>
                    </div>
                    <textarea id="appCodeInput" rows="8" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head>&#10;  <title>Mi Pagina</title>&#10;</head>&#10;<body>&#10;  <h1>¡Hola Mundo!</h1>&#10;</body>&#10;</html>" class="code-editor w-full p-3.5 rounded-xl border border-red-900/50 text-xs text-red-400 bg-black focus:outline-none focus:border-red-500 font-mono"></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-red-300 block mb-1">Imagen de Portada (Sube una imagen o pégala con Ctrl+V)</label>
                    <div class="flex gap-2 items-center">
                        <input type="file" id="appCoverInput" accept="image/*" class="flex-1 text-xs text-zinc-400 border border-red-900/50 rounded-xl p-2 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-red-950 file:text-red-400 file:font-bold">
                    </div>
                    <div id="coverPreviewContainer" class="mt-2 hidden">
                        <img id="coverPreview" class="w-full h-28 object-cover rounded-xl border border-red-900/50">
                    </div>
                </div>
            </div>

            <div class="flex gap-2 mt-2 border-t border-red-950 pt-3">
                <button onclick="saveProject()" class="flex-1 py-3 rounded-2xl red-btn text-xs font-bold">Guardar y Publicar</button>
                <button onclick="closeModal('publishModal')" class="px-5 py-3 rounded-2xl bg-zinc-900 text-xs font-bold text-zinc-300 hover:bg-zinc-800">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80">
        <div class="bg-zinc-950 w-full max-w-2xl rounded-3xl p-6 shadow-2xl flex flex-col gap-4 border border-red-900/60 max-h-[90vh] overflow-y-auto text-white">
            <div class="flex justify-between items-center border-b border-red-950 pb-3">
                <h3 class="text-base font-bold font-syne text-red-500">Editar Código</h3>
                <button onclick="closeModal('editModal')" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <input type="hidden" id="editId">
            <div class="flex flex-col gap-4">
                <div>
                    <label class="text-xs font-bold text-red-300 block mb-1">Nombre</label>
                    <input type="text" id="editName" class="w-full px-4 py-2.5 rounded-xl border border-red-900/50 bg-zinc-900 text-xs text-white focus:outline-none focus:border-red-500">
                </div>

                <div>
                    <label class="text-xs font-bold text-red-300 block mb-1">Código HTML</label>
                    <textarea id="editCode" rows="8" class="code-editor w-full p-3.5 rounded-xl border border-red-900/50 text-xs text-red-400 bg-black focus:outline-none focus:border-red-500 font-mono"></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-red-300 block mb-1">Cambiar Portada (Opcional)</label>
                    <input type="file" id="editCover" accept="image/*" class="w-full text-xs text-zinc-400 border border-red-900/50 rounded-xl p-2 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-red-950 file:text-red-400 file:font-bold">
                </div>
            </div>

            <div class="flex gap-2 mt-2 border-t border-red-950 pt-3">
                <button onclick="updateProject()" class="flex-1 py-3 rounded-2xl red-btn text-xs font-bold">Actualizar Cambios</button>
                <button onclick="closeModal('editModal')" class="px-5 py-3 rounded-2xl bg-zinc-900 text-xs font-bold text-zinc-300">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="runnerModal" class="fixed inset-0 z-50 hidden bg-black flex-col">
        <div class="bg-zinc-950 text-white px-4 py-2.5 flex items-center justify-between border-b border-red-950">
            <span id="runnerTitle" class="text-xs font-bold text-red-400 font-syne">Vista Previa</span>
            <button onclick="closeRunner()" class="px-3 py-1.5 bg-red-700 hover:bg-red-600 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                <i data-lucide="x" class="w-4 h-4"></i> Cerrar
            </button>
        </div>
        <iframe id="appIframe" class="w-full h-full border-0 bg-white"></iframe>
    </div>

    <div id="logoModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80">
        <div class="bg-zinc-950 w-full max-w-xs p-5 rounded-3xl text-white flex flex-col gap-4 border border-red-900/60">
            <h3 class="text-sm font-bold text-red-500 font-syne">Cambiar Logo Principal</h3>
            <input type="file" id="logoFileInput" accept="image/*" class="w-full text-xs text-zinc-400 border border-red-900/50 rounded-xl p-2 bg-zinc-900">
            <div class="flex gap-2">
                <button onclick="saveLogo()" class="flex-1 py-2.5 rounded-xl red-btn text-xs font-bold">Guardar</button>
                <button onclick="closeModal('logoModal')" class="px-4 py-2.5 rounded-xl bg-zinc-900 text-xs text-zinc-300">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('Vangeliicide_Codes_V3', 1);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('projects')) {
                        database.createObjectStore('projects', { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        // APLICAR FONDO DE PANTALLA NÍTIDO
        function changeWallpaper(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const bgUrl = e.target.result;
                    applyWallpaper(bgUrl);
                    localStorage.setItem('vangel_codes_wallpaper', bgUrl);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function applyWallpaper(url) {
            const body = document.getElementById('appBody');
            body.style.backgroundImage = `url('${url}')`;
            body.classList.add('custom-wallpaper');
        }

        function loadSavedWallpaper() {
            const saved = localStorage.getItem('vangel_codes_wallpaper');
            if (saved) {
                applyWallpaper(saved);
            }
        }

        // CARGAR CÓDIGO ARCHIVO EN EL TEXTAREA
        function loadFileIntoTextarea(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('appCodeInput').value = e.target.result;
                };
                reader.readAsText(input.files[0]);
            }
        }

        // MOSTRAR PREVIEW DE IMAGEN
        let currentCoverBase64 = null;
        function previewCoverImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentCoverBase64 = e.target.result;
                    const img = document.getElementById('coverPreview');
                    img.src = currentCoverBase64;
                    document.getElementById('coverPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // PEGAR IMAGEN DESDE EL PORTAPAPELES
        document.addEventListener('paste', function(e) {
            const modal = document.getElementById('publishModal');
            if (!modal.classList.contains('hidden')) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const blob = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            currentCoverBase64 = evt.target.result;
                            const img = document.getElementById('coverPreview');
                            img.src = currentCoverBase64;
                            document.getElementById('coverPreviewContainer').classList.remove('hidden');
                        };
                        reader.readAsDataURL(blob);
                        break;
                    }
                }
            }
        });

        // GUARDAR CÓDIGO Y PUBLICAR PROYECTO
        async function saveProject() {
            const name = document.getElementById('appNameInput').value.trim();
            const code = document.getElementById('appCodeInput').value.trim();

            if (!name) {
                alert('Por favor ingresa un nombre para el proyecto.');
                return;
            }

            if (!code) {
                alert('Escribe o pega el código HTML completo.');
                return;
            }

            let coverData = currentCoverBase64 || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&auto=format&fit=crop&q=80';

            await initDB();
            const project = {
                id: 'proj_' + Date.now(),
                name: name,
                html: code,
                cover: coverData,
                date: new Date().toLocaleDateString()
            };

            const tx = db.transaction('projects', 'readwrite');
            tx.objectStore('projects').add(project);
            tx.oncomplete = () => {
                closeModal('publishModal');
                document.getElementById('appNameInput').value = '';
                document.getElementById('appCodeInput').value = '';
                document.getElementById('appCoverInput').value = '';
                document.getElementById('coverPreviewContainer').classList.add('hidden');
                currentCoverBase64 = null;
                renderProjects();
            };
        }

        // RENDERIZAR TARJETAS
        async function renderProjects() {
            await initDB();
            const tx = db.transaction('projects', 'readonly');
            const projects = await new Promise(res => tx.objectStore('projects').getAll().onsuccess = e => res(e.target.result));

            const grid = document.getElementById('projectsGrid');
            document.getElementById('projectCountBadge').innerText = projects.length;
            grid.innerHTML = '';

            if (projects.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-10 text-center text-red-400 font-bold text-xs bg-zinc-950/90 rounded-3xl border border-red-900/50 p-6 shadow-lg">
                        No hay proyectos creados. Haz clic en <b>"+ Publicar"</b> para pegar o escribir tu código HTML.
                    </div>
                `;
                return;
            }

            projects.forEach(p => {
                const card = document.createElement('div');
                card.className = 'app-tile p-2.5 flex flex-col gap-2.5';
                card.innerHTML = `
                    <div class="relative w-full h-36 sm:h-40 rounded-2xl overflow-hidden bg-black group border border-red-950">
                        <img src="${p.cover}" class="w-full h-full object-cover opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        
                        <div class="absolute bottom-2 left-2 right-2 bg-black/80 backdrop-blur-md px-2.5 py-1 rounded-xl border border-red-900/50 text-red-200 font-bold text-[11px] truncate text-center shadow">
                            ${escapeHtml(p.name)}
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5">
                        <button onclick="runApp('${p.id}')" class="flex-1 red-btn py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                            <span>▷ Abrir</span>
                        </button>
                        <button onclick="openEdit('${p.id}')" class="p-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-red-400 border border-red-950 transition">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="deleteProject('${p.id}')" class="p-2 rounded-xl bg-zinc-900 hover:bg-rose-950 text-rose-500 border border-rose-950 transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // ABRIR Y EJECUTAR CÓDIGO HTML
        async function runApp(id) {
            await initDB();
            const tx = db.transaction('projects', 'readonly');
            const project = await new Promise(res => tx.objectStore('projects').get(id).onsuccess = e => res(e.target.result));

            if (project) {
                document.getElementById('runnerTitle').innerText = project.name;
                const iframe = document.getElementById('appIframe');
                iframe.srcdoc = project.html;
                document.getElementById('runnerModal').classList.remove('hidden');
                document.getElementById('runnerModal').classList.add('flex');
            }
        }

        function closeRunner() {
            document.getElementById('runnerModal').classList.add('hidden');
            document.getElementById('runnerModal').classList.remove('flex');
            document.getElementById('appIframe').srcdoc = '';
        }

        // EDITAR CÓDIGO Y NOMBRE
        async function openEdit(id) {
            await initDB();
            const tx = db.transaction('projects', 'readonly');
            const project = await new Promise(res => tx.objectStore('projects').get(id).onsuccess = e => res(e.target.result));

            if (project) {
                document.getElementById('editId').value = project.id;
                document.getElementById('editName').value = project.name;
                document.getElementById('editCode').value = project.html;
                openModal('editModal');
            }
        }

        async function updateProject() {
            const id = document.getElementById('editId').value;
            const newName = document.getElementById('editName').value.trim();
            const newCode = document.getElementById('editCode').value.trim();
            const coverFile = document.getElementById('editCover').files[0];

            if (!newName || !newCode) return;

            await initDB();
            const tx = db.transaction('projects', 'readwrite');
            const store = tx.objectStore('projects');
            const project = await new Promise(res => store.get(id).onsuccess = e => res(e.target.result));

            if (project) {
                project.name = newName;
                project.html = newCode;
                if (coverFile) {
                    project.cover = await readFileDataURL(coverFile);
                }
                store.put(project);
            }

            tx.oncomplete = () => {
                closeModal('editModal');
                renderProjects();
            };
        }

        // ELIMINAR PROYECTO
        async function deleteProject(id) {
            if (!confirm('¿Seguro que deseas eliminar este proyecto?')) return;
            await initDB();
            const tx = db.transaction('projects', 'readwrite');
            tx.objectStore('projects').delete(id);
            tx.oncomplete = () => renderProjects();
        }

        // LOGO
        function saveLogo() {
            const input = document.getElementById('logoFileInput');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('appLogoImg').src = e.target.result;
                    localStorage.setItem('vangel_codes_logo', e.target.result);
                    closeModal('logoModal');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function loadLogo() {
            const saved = localStorage.getItem('vangel_codes_logo');
            if (saved) document.getElementById('appLogoImg').src = saved;
        }

        // HELPER MODALES
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function readFileDataURL(file) {
            return new Promise((res) => {
                const r = new FileReader();
                r.onload = e => res(e.target.result);
                r.readAsDataURL(file);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.onload = async () => {
            loadSavedWallpaper();
            loadLogo();
            await renderProjects();
            lucide.createIcons();
        };
    </script>
</body>
</html>
